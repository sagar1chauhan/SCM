<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >SignUp Page</title>
</head>

<body>
  
  <div id="content">
   <div class="grid grid-col-12 ">
    <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>
        <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">
          <!-- card -->
           
<div  class="block  p-6 max-w-sm border-t-[10px] border-blue-700 mx-auto bg-white  rounded-xl shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-blue-700 dark:hover:bg-gray-700">
<!-- alert message  -->
 <div th:replace="~{message::messagebox}"></div>

<h5 class="mb-1 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
  SignUp here</h5>
<p class="font-normal text-gray-400 dark:text-gray-400">Start managing contacts on cloud</p>

<form th:action="@{'/do-register'}"
 method="post" 
 th:object="${userForm}"
 class="mt-1 max-w-sm mx-auto"
 novalidate
 >

    <div class="mb-3">
    <label for="name" 
    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
    >Name
  </label>
    <input 
    type="text"
    th:field="*{name}"
     id="name"
    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
    placeholder="Enter your name" required />
    <p 
    th:if="${#fields.hasErrors('name')}"
    th:errors="*{name}"
    class="text-red-600 px-1 py-2 "></p>
  </div>

  <div class="mb-3">
    <label for="email" 
    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
    Email
  </label>
    <input type="email" 
      th:field="*{email}"
    id="email" 
    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
    placeholder="name@flowbite.com" required />
     <p 
    th:if="${#fields.hasErrors('email')}"
    th:errors="*{email}"
    class="text-red-600 px-1 py-2 "></p>
  </div>

  <div class="mb-3">
    <label for="password" 
    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
   New Password
  </label>
    <input type="password" 
      th:field="*{password}"
    id="password" 
    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
    placeholder="StrongPassword" required />
     <p 
    th:if="${#fields.hasErrors('password')}"
    th:errors="*{password}"
    class="text-red-600 px-1 py-2 "></p>
  </div>


   <div class="mb-3">
    <label for="phone" 
    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
   Contact Number
  </label>
    <input type="text"
      th:field="*{phoneNumber}" 
    id="phone" 
    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
     required /> 
      <p 
    th:if="${#fields.hasErrors('phoneNumber')}"
    th:errors="*{phoneNumber}"
    class="text-red-600 px-1 py-2 "></p> 
    </div>


     <!-- text area -->
   <div class="mb-3">
    <label for="about" 
    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
   Write Something About youself
   </label>
    <textarea 
    id="about" 
      th:field="*{about}"
    rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
    placeholder="Write  here..."></textarea>
 <p 
    th:if="${#fields.hasErrors('about')}"
    th:errors="*{about}"
    class="text-red-600 px-1 py-2 "></p>
      </div>
    <div class="mb-3 flex justify-center space-x-2">
      <button class="mt-3 px-3 py-2 rounded bg-gray-800 hover:bg-gray-400 text-white dark:bg-blue-800 dark:hover:bg-blue-500">
        SignUp
      </button>
       <button class="mt-3 px-3 py-2 rounded bg-orange-800 hover:bg-orange-400 text-white dark:bg-orange-800 dark:hover:bg-orange-400">
        Reset
      </button>
    </div>
                

            </form>
           </div>

        </div>
     </div>
    </div>
  <script>console.log("SignUp page")</script>
   
</body>
</html>
