<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
    <title>Chat</title>
    <style>
        body { margin:0; font-family:Arial; }
        .layout { display:flex; height:100vh; }

        /* Sidebar */
        .sidebar { width: 320px; border-right: 1px solid #ddd; display:flex; flex-direction:column; }
        .search-bar { padding:10px; border-bottom:1px solid #ddd; }
        .search-bar input { width:100%; padding:8px; border-radius:5px; border:1px solid #ccc; }
        .contact-list { overflow-y:auto; flex:1; }
        .contact-card { padding:10px; display:flex; align-items:center; border-bottom:1px solid #f1f1f1; cursor:pointer; }
        .contact-card:hover { background:#f5f5f5; }
        .active-chat { background:#e8f0ff; }
        .contact-card img { width:45px; height:45px; border-radius:50%; object-fit:cover; margin-right:10px; }
        .contact-name { font-weight:bold; }

        /* Chat window */
        .chat-window { flex:1; display:flex; flex-direction:column; }
        .chat-header { padding:15px; border-bottom:1px solid #ddd; display:flex; align-items:center; }
        .chat-header img { width:45px; height:45px; border-radius:50%; margin-right:10px; }
        .messages { flex:1; overflow-y:auto; padding:15px; background:#f2f2f2; }
        .msg-user { text-align:right; margin:5px 0; }
        .msg-user span { background:#4f8bff; color:white; padding:8px 12px; border-radius:12px; }
        .msg-other { text-align:left; margin:5px 0; }
        .msg-other span { background:white; padding:8px 12px; border-radius:12px; }
        .send-box { padding:10px; display:flex; border-top:1px solid #ddd; }
        .send-box input { flex:1; padding:10px; border:1px solid #ccc; border-radius:5px; }
        .send-box button { background:#4f8bff; color:white; border:none; padding:10px 20px; margin-left:10px; border-radius:5px; cursor:pointer; }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search contacts...">
        </div>

        <div class="contact-list">
            <div th:each="c : ${contacts}"
                 th:classappend="${c.email == receiver.email} ? 'active-chat'"
                 class="contact-card"
                 th:attr="data-email=${c.email}"
                 onclick="goToChat(this)">
                <img th:src="${c.picture != null ? c.picture : '/images/default.png'}" />
                <div>
                    <div class="contact-name" th:text="${c.name}">Name</div>
                    <div class="last-msg">Last message...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHAT WINDOW -->
    <div class="chat-window">
        <div class="chat-header">
            <img th:src="${receiver.picture != null ? receiver.picture : '/images/default.png'}" />
            <div>
                <div th:text="${receiver.name}" style="font-weight:bold;"></div>
                <small th:text="${receiver.email}"></small>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="send-box">
            <input id="msgInput" type="text" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script th:inline="javascript">
    // Thymeleaf variables injected
    const userEmail = /*[[${loggedInUser.email}]]*/ 'user@example.com';
    const receiverEmail = /*[[${receiver.email}]]*/ 'contact@example.com';

    function goToChat(el) {
        const email = el.getAttribute("data-email");
        window.location.href = "/user/direct-message/" + email;
    }

    let poller;

    function startPolling() {
        if (poller) clearInterval(poller);
        fetchMessages();
        poller = setInterval(fetchMessages, 2000);
    }

    function fetchMessages() {
        fetch(`/api/chat/${userEmail}/${receiverEmail}`)
            .then(res => res.json())
            .then(list => {
                const box = document.getElementById("messages");
                box.innerHTML = "";

                list.forEach(m => {
                    const div = document.createElement("div");
                    div.className = (m.senderEmail === userEmail) ? "msg-user" : "msg-other";
                    div.innerHTML = `<span>${m.text}</span>`;
                    box.appendChild(div);
                });

                box.scrollTop = box.scrollHeight;
            })
            .catch(err => console.error("Error fetching messages:", err));
    }

    function sendMessage() {
        const text = document.getElementById("msgInput").value;
        if (!text.trim()) return;

        fetch("/api/chat/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                senderEmail: userEmail, 
                receiverEmail: receiverEmail, 
                text: text 
            })
        })
        .then(() => {
            document.getElementById("msgInput").value = "";
            fetchMessages();
        });
    }

    document.addEventListener("DOMContentLoaded", startPolling);
</script>

</body>
</html>
