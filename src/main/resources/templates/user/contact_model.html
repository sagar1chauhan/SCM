<div th:fragment="contact">



<!-- Main modal -->
<!-- View Contact Modal -->
<div id="view_contact_modal" tabindex="-1" aria-hidden="true"
  class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">

  <div class="relative p-4 w-full max-w-md max-h-full">
    <!-- Modal content -->
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-800">
      
      <!-- Close button -->
      <button type="button" onclick="closeContactModal()" 
        class="absolute top-3 right-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 
        rounded-lg text-sm w-8 h-8 ml-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m1 1 6 6m0 0 6-6M7 7l6 6M7 7l-6 6" />
        </svg>
        <span class="sr-only">Close modal</span>
      </button>

      <!-- Modal body -->
      <div class="p-6 text-center flex flex-col items-center space-y-4">

        <!-- Profile Picture -->
        <img id="contact_image" 
             src="/images/default-user.png" 
             alt="Contact Image"
             class="w-24 h-24 rounded-full object-cover shadow-lg">

        <!-- Contact Name -->
        <h3 id="contact_name" class="text-lg font-semibold text-gray-900 dark:text-white">Contact Name</h3>

        <!-- Email -->
        <p id="contact_email" class="text-sm text-gray-500 dark:text-gray-400">email@example.com</p>

        <!-- Phone -->
        <p id="contact_phone" class="text-sm text-gray-500 dark:text-gray-400">+91 9876543210</p>

        <!-- Address -->
        <div class="flex items-center gap-2 text-gray-600 dark:text-gray-300">
          <i class="fas fa-map-marker-alt"></i>
          <span id="contact_address">No Address Provided</span>
        </div>

        <!-- About -->
        <div class="flex items-center gap-2 text-gray-600 dark:text-gray-300">
          <i class="fas fa-user"></i>
          <span id="contact_about">No description available</span>
        </div>

        <!-- Favorite -->
        <div class="flex items-center gap-2 text-yellow-500" id="contact_favorite">
          <i class="far fa-star"></i> Not Favorite Contact
        </div>

        <!-- Website -->
        <div class="flex items-center gap-2 text-blue-600 dark:text-blue-400">
          <i class="fas fa-globe"></i>
          <a id="contact_website" href="#" target="_blank" class="hover:underline">
            https://example.com
          </a>
        </div>

        <!-- LinkedIn -->
        <div class="flex items-center gap-2 text-blue-700">
          <i class="fab fa-linkedin"></i>
          <a id="contact_linkedIn" href="#" target="_blank" class="hover:underline">
            https://linkedin.com/in/example
          </a>
        </div>

        <!-- Close button -->
        <button onclick="closeContactModal()"
          class="mt-4 px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-400">
          Close
        </button>

      </div>
    </div>
  </div>
</div>


</div>
